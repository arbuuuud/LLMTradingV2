    daily_profit_target_pct: 8.0
    active_sessions: "ALL_DAY (24 Hours)"
    historical_win_rate: "TBD (Awaiting Tournament)"
    historical_profit_factor: 0.0
    historical_max_drawdown: "0.0%"
