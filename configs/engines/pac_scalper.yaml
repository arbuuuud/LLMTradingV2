# PAC Scalper Engine Specification & Operational Guide
# Architecture Reference: DEC-018, DEC-019, DEC-020, DEC-021, DEC-027, DEC-028 (Tier 2 Plug-in Engine)

engine:
  id: "pac_scalper_v2_champion"
  name: "PAC (Price Action Channel) Scalper - Multi-Session Champion"
  version: "2.1.0"
  asset: "XAUUSD"
  primary_timeframe: "M1"
  supported_timeframes: ["M1", "M2", "M3", "M4", "M5"]
  description: >
    Engine kuantitatif berbasis Price Action Channel (PAC), Supply & Demand Floor/Roof,
    penetrasi 3-Layer Grid simultan dengan alokasi Pyramid 20-30-50, Multi-Session Equity Budgeting,
    House Money Carryover, dan pengawasan risiko kognitif Sasuke Sharingan.

entry_rules:
  # Kuadran PAC: 0-25% Buy Discount, 75-100% Sell Premium, 50% Equilibrium Target
  buy_zone: "0% - 25% Channel Depth (Discount)"
  sell_zone: "75% - 100% Channel Depth (Premium)"
  order_mode: "SIMULTANEOUS_3_LAYER_GRID" # Juara Turnamen Kage Bunshin Subtask 5-3D
  grid_pyramid_allocation:
    layer_1:
      label: "L1 (Lip / Bibir Zona)"
      allocation_pct: 20.0
      purpose: "Front-run touchpoint capture"
    layer_2:
      label: "L2 (Mid / Inti Zona)"
      allocation_pct: 30.0
      purpose: "Median zone liquidity absorb"
    layer_3:
      label: "L3 (Floor / Dasar Zona)"
      allocation_pct: 50.0
      purpose: "Maximum discount fill & ultra-tight SL distance"

exit_and_risk_rules:
  # Sasuke Sharingan Overseer & Greed Trailing (Subtask 5-3A, 5-3B & DEC-028 CLONE-08)
  sasuke_reversal_cognition:
    enabled: true
    min_running_profit_r: 1.0   # Hanya aktif jika posisi sudah bernapas >= +1.0R
    patterns_monitored:
      - "Evening Star / Morning Star at zone extreme"
      - "Opposite Momentum Marubozu (Body ratio >= 70%)"
    action: "FORCE_CLOSE_100 (Amankan profit di pucuk sebelum terpangkas)"

  session_equity_budgeting:
    enabled: true  # DEC-028 Champion CLONE-08
    sessions:
      asian: "00:00 - 07:00 UTC (Base Budget: 0.50% Fleet Equity)"
      london: "07:00 - 13:30 UTC (Base Budget: 0.50% Fleet Equity)"
      ny_overlap: "13:30 - 21:00 UTC (Base Budget: 0.50% Fleet Equity)"
      off_hours: "21:00 - 00:00 UTC (Standby / Rollover spread protection)"
    house_money_carryover:
      enabled: true
      rule: "Jika sesi sebelumnya profit >= +1.0%, tambahkan 25% profit tersebut ke budget risiko sesi berikutnya."

  greed_trailing_stepped:
    enabled: true  # CLONE-08 Stepped Trail: lock +0.5% per milestone, pullback 0.5% -> Session Halted
    milestone_step_pct: 0.50
    pullback_tolerance_pct: 0.50
    tiers:
      - trigger: "Equity >= +1.0%"
        lock_equity: "+0.5%"
      - trigger: "Equity >= +1.5%"
        lock_equity: "+1.0%"
      - trigger: "Equity >= +2.0%"
        lock_equity: "+1.5%"
      - trigger: "Equity >= +2.5%"
        lock_equity: "+2.0%"

  adaptive_quick_escape:
    enabled: true  # Subtask 5-3C Juara Turnamen
    first_retest_tp: "Midpoint Equilibrium 50%"
    second_plus_retest_tp: "Zone Edge (25% Buy Ceiling / 75% Sell Floor) or min +0.75R"

  daily_circuit_breaker:
    enabled: true
    max_daily_loss_pct: -1.0  # Hard Lockout per hari jika akumulasi multi-sesi mencapai batas
    daily_profit_target_pct: 2.5

risk_profiles:
  prop_firm:
    label: "Prop Firm (FTMO / MFF Ultra-Safe)"
    description: "Disetel khusus untuk lolos aturan drawdown prop firm yang sangat ketat (Max DD < 5%)."
    risk_per_trade_pct: 0.25
    max_daily_loss_pct: -1.0
    daily_profit_target_pct: 2.0
    active_sessions: "ALL_3_SESSIONS (Asian, London, NY Overlap via DEC-028)"
    avoid_rollover_spread: true  # Skip 21:00 - 23:59 UTC
    basket_mode: "QUARTET (M1+M2+M3+M5)"
    historical_win_rate: "95.1%"
    historical_profit_factor: 176.22
    historical_max_drawdown: "0.17%"

  sweet_spot:
    label: "Sweet Spot (Balanced Institutional)"
    description: "Keseimbangan optimal antara frekuensi trading dan keamanan modal."
    risk_per_trade_pct: 0.50
    max_daily_loss_pct: -1.0
    daily_profit_target_pct: 2.5
    active_sessions: "ALL_DAY (24 Hours)"
    avoid_rollover_spread: true
    basket_mode: "QUARTET (M1+M2+M3+M5)"
    historical_win_rate: "95.2%"
    historical_profit_factor: 176.31
    historical_max_drawdown: "1.50%"

  aggressive:
    label: "Aggressive (High Compounding)"
    description: "Pertumbuhan ekuitas cepat dengan memanfaatkan seluruh peluang M1/M2/M3."
    risk_per_trade_pct: 1.00
    max_daily_loss_pct: -2.0
    daily_profit_target_pct: 4.0
    active_sessions: "ALL_DAY (24 Hours)"
    avoid_rollover_spread: false
    basket_mode: "TRIO (M1+M2+M3)"
    historical_win_rate: "95.2%"
    historical_profit_factor: 176.31
    historical_max_drawdown: "3.00%"

  yolo:
    label: "YOLO (Apex High-Frequency)"
    description: "Mode ekspansif maksimal untuk akun kontes atau compounding modal kecil."
    risk_per_trade_pct: 2.00
    max_daily_loss_pct: -4.0
    daily_profit_target_pct: 8.0
    active_sessions: "ALL_DAY (24 Hours)"
    avoid_rollover_spread: false
    basket_mode: "TRIO (M1+M2+M3)"
    historical_win_rate: "95.2%"
    historical_profit_factor: 176.31
    historical_max_drawdown: "6.00%"
